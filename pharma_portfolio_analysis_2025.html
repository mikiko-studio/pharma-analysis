<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界大手5社 製薬ポートフォリオ分析 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f7f4; color: #1a1a1a; padding: 24px; line-height: 1.5; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
.tab-bar { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 7px 16px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #555; background: #fff; transition: all 0.15s; }
.tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.tab:hover:not(.active) { border-color: #888; }
.section { display: none; }
.section.active { display: block; }
.company-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.ctab { padding: 5px 12px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; color: #555; background: #fff; transition: all 0.15s; }
.ctab.active { background: #f0efe8; color: #1a1a1a; border-color: #888; }
.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.metric { background: #f0efe8; border-radius: 8px; padding: 12px 14px; }
.metric-label { font-size: 11px; color: #666; margin-bottom: 4px; }
.metric-value { font-size: 22px; font-weight: 500; }
.product-table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 10px; overflow: hidden; }
.product-table th { font-size: 11px; font-weight: 500; color: #666; text-align: left; padding: 8px 12px; border-bottom: 1px solid #e8e6e0; background: #fafaf8; }
.product-table td { padding: 10px 12px; border-bottom: 1px solid #f0efe8; vertical-align: middle; }
.product-table tr:last-child td { border-bottom: none; }
.bar-wrap { background: #f0efe8; border-radius: 3px; height: 8px; width: 120px; }
.bar-fill { height: 8px; border-radius: 3px; }
.patent-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
.badge-red { background: #fce8e8; color: #a32d2d; }
.badge-amber { background: #faeeda; color: #854f0b; }
.badge-green { background: #eaf3de; color: #3b6d11; }
.badge-teal { background: #e1f5ee; color: #0f6e56; }
.pipeline-card { border: 1px solid #e0ded8; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; background: #fff; }
.pipeline-name { font-size: 13px; font-weight: 500; }
.pipeline-detail { font-size: 12px; color: #666; margin-top: 3px; }
.risk-gauge { height: 10px; border-radius: 5px; background: #f0efe8; position: relative; overflow: hidden; margin-top: 4px; }
.risk-fill { height: 100%; border-radius: 5px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.overview-card { border: 1px solid #e0ded8; border-radius: 12px; padding: 16px; cursor: pointer; transition: border-color 0.15s; background: #fff; }
.overview-card:hover { border-color: #888; }
.company-name { font-size: 15px; font-weight: 500; }
.company-rev { font-size: 22px; font-weight: 500; margin-top: 4px; display: inline; }
.company-growth { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-left: 8px; }
.growth-pos { background: #eaf3de; color: #3b6d11; }
.growth-neg { background: #fce8e8; color: #a32d2d; }
.analysis-block { border-left: 3px solid; padding: 12px 16px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
</style>
</head>

const companyKeys = ["lilly","merck","pfizer","az","novartis"];

function patentBadge(year) {
  const yrs = year - 2025;
  if (yrs <= 2) return `<span class="patent-badge badge-red">${year}年失効</span>`;
  if (yrs <= 4) return `<span class="patent-badge badge-amber">${year}年失効</span>`;
  if (yrs <= 7) return `<span class="patent-badge badge-teal">${year}年以降</span>`;
  return `<span class="patent-badge badge-green">${year}年以降</span>`;
}

function buildOverview() {
  const grid = document.getElementById("ovGrid");
  companyKeys.forEach(k => {
    const c = companies[k];
    const gr = c.growth >= 0
      ? `<span class="company-growth growth-pos">+${c.growth}%</span>`
      : `<span class="company-growth growth-neg">${c.growth}%</span>`;
    const risk = c.riskScore;
    const rColor = risk > 60 ? "#E24B4A" : risk > 35 ? "#EF9F27" : "#639922";
    grid.innerHTML += `<div class="overview-card" onclick="switchToCompany('${k}')">
      <div class="company-name">${c.name} <span style="font-size:12px;color:#888;">${c.short}</span></div>
      <div><span class="company-rev" style="color:${c.color}">$${c.rev2025}B</span>${gr}</div>
      <div style="margin-top:10px;">
        <div style="font-size:11px;color:#666;margin-bottom:3px;">特許リスクスコア (0=低, 100=高)</div>
        <div class="risk-gauge"><div class="risk-fill" style="width:${risk}%;background:${rColor};"></div></div>
        <div style="font-size:11px;color:${rColor};margin-top:2px;font-weight:500;">${risk}/100</div>
      </div>
      <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:11px;color:#666;">自己資本比率</div>
          <div style="font-size:16px;font-weight:500;color:${c.equityRatio>=40?'#3B6D11':c.equityRatio>=30?'#854F0B':'#A32D2D'};">${c.equityRatio.toFixed(1)}%</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:#666;">総資産</div>
          <div style="font-size:13px;font-weight:500;color:#444;">$${c.totalAssets}B</div>
        </div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#999;">クリックで詳細 →</div>
    </div>`;
  });
}

function switchToCompany(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('products').classList.add('active');
  document.querySelector('[data-tab="products"]').classList.add('active');
  buildProductTabs();
  switchProdTab(key);
}

function buildProductTabs() {
  const el = document.getElementById("prodTabs");
  if (el.innerHTML) return;
  companyKeys.forEach((k, i) => {
    const c = companies[k];
    el.innerHTML += `<button class="ctab${i===0?' active':''}" data-prod="${k}" onclick="switchProdTab('${k}')">${c.name}</button>`;
  });
  buildProdContent("lilly");
}

function switchProdTab(key) {
  document.querySelectorAll('#prodTabs .ctab').forEach(t => {
    t.classList.toggle('active', t.dataset.prod === key);
  });
  buildProdContent(key);
}

function buildProdContent(key) {
  const c = companies[key];
  const maxRev = Math.max(...c.products.map(p => p.rev));
  let html = `<div class="metric-grid">
    <div class="metric"><div class="metric-label">2025年総売上高</div><div class="metric-value" style="color:${c.color}">$${c.rev2025}B</div></div>
    <div class="metric"><div class="metric-label">成長率 (YoY)</div><div class="metric-value" style="color:${c.growth>=0?'#3B6D11':'#A32D2D'}">${c.growth>=0?'+':''}${c.growth}%</div></div>
    <div class="metric"><div class="metric-label">自己資本比率</div><div class="metric-value" style="color:${c.equityRatio>=40?'#3B6D11':c.equityRatio>=30?'#854F0B':'#A32D2D'}">${c.equityRatio.toFixed(1)}%</div></div>
    <div class="metric"><div class="metric-label">パテントリスク</div><div class="metric-value" style="color:${c.riskScore>60?'#A32D2D':c.riskScore>35?'#854F0B':'#3B6D11'}">${c.riskScore}/100</div></div>
  </div>
  <table class="product-table">
    <thead><tr>
      <th>製品名</th><th>適応症</th><th style="text-align:right">2025年売上</th><th style="min-width:130px">売上比率</th><th>パテント期限</th>
    </tr></thead><tbody>`;
  c.products.forEach(p => {
    const pct = Math.round(p.rev / maxRev * 100);
    html += `<tr>
      <td style="font-weight:500">${p.name}</td>
      <td style="color:#666;font-size:12px;">${p.indication}</td>
      <td style="text-align:right;font-weight:500;color:${c.color};">$${p.rev.toFixed(1)}B</td>
      <td><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${c.color};"></div></div></td>
      <td>${patentBadge(p.patent)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("prodContent").innerHTML = html;
}

function buildPipeTabs() {
  const el = document.getElementById("pipeTabs");
  if (el.innerHTML) return;
  companyKeys.forEach((k, i) => {
    const c = companies[k];
    el.innerHTML += `<button class="ctab${i===0?' active':''}" data-pipe="${k}" onclick="switchPipeTab('${k}')">${c.name}</button>`;
  });
  buildPipeContent("lilly");
}

function switchPipeTab(key) {
  document.querySelectorAll('#pipeTabs .ctab').forEach(t => {
    t.classList.toggle('active', t.dataset.pipe === key);
  });
  buildPipeContent(key);
}

function buildPipeContent(key) {
  const c = companies[key];
  let html = `<div style="margin-bottom:14px;font-size:13px;color:#666;">${c.name}の主要開発パイプライン（後期段階）</div>`;
  c.pipeline.forEach(p => {
    const phaseColor = p.phase.includes("承認") || p.phase.includes("市販") ? "#3B6D11" : p.phase.includes("申請") ? "#185FA5" : p.phase.includes("Ph3") ? "#854F0B" : "#5F5E5A";
    const phaseBg = p.phase.includes("承認") || p.phase.includes("市販") ? "#EAF3DE" : p.phase.includes("申請") ? "#E6F1FB" : p.phase.includes("Ph3") ? "#FAEEDA" : "#F1EFE8";
    html += `<div class="pipeline-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <div class="pipeline-name">${p.name}</div>
        <span style="font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;background:${phaseBg};color:${phaseColor};">${p.phase}</span>
      </div>
      <div class="pipeline-detail">${p.indication}</div>
      <div style="margin-top:8px;font-size:12px;color:#666;">ピーク時売上見込み: <strong style="color:#1a1a1a;font-weight:500;">${p.peak}</strong></div>
    </div>`;
  });
  document.getElementById("pipeContent").innerHTML = html;
}

document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'products') buildProductTabs();
    if (btn.dataset.tab === 'patent') setTimeout(buildPatentChart, 50);
    if (btn.dataset.tab === 'pipeline') buildPipeTabs();
    if (btn.dataset.tab === 'equity') buildEquity();
    if (btn.dataset.tab === 'analysis') buildAnalysis();
  });
});

buildOverview();
window.addEventListener('load', () => { setTimeout(buildOvChart, 200); });
